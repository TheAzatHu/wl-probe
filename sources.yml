# Реестр источников VLESS-конфигов.
#
#   category:  general    — обычный обход
#              whitelist  — источники, ориентированные на белые списки РФ
#              discovery  — зеркала, нужны только для отказоустойчивости
#   trust:     0..100, влияет на порядок при равном качестве
#   max_bytes: жёсткий предел загрузки, защита от гигантских зеркал
#
# Каждый источник = отдельная параллельная задача в GitHub Actions.

